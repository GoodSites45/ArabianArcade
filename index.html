
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exclusive</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cyan: #00d9ff;
    --blue: #367cff;
    --purple: #914cff;
    --pink: #ff4fa3;
    --bg: #03050b;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

/* =========================================================
   SIMPLE BACKGROUND
========================================================= */

.background {
    position: fixed;
    inset: 0;
    z-index: -10;

    background:
        radial-gradient(
            circle at 18% 18%,
            rgba(0, 217, 255, .12),
            transparent 28%
        ),
        radial-gradient(
            circle at 82% 75%,
            rgba(145, 76, 255, .12),
            transparent 30%
        ),
        #03050b;
}

/* Lightweight moving lines */

.background::before {
    content: "";
    position: absolute;
    inset: -50%;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 70px 70px;

    transform: rotate(8deg);

    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }

    to {
        background-position: 70px 70px;
    }
}

/* Vignette */

.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.5) 100%
        );

    z-index: -2;
}

/* =========================================================
   CURSOR GLOW
========================================================= */

.cursorGlow {
    position: fixed;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    pointer-events: none;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(0,217,255,.11),
            transparent 68%
        );

    z-index: -1;
}

/* =========================================================
   TOP LABEL
========================================================= */

.topLabel {
    position: fixed;

    top: 22px;
    right: 22px;

    padding: 10px 15px;

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px;

    background: rgba(255,255,255,.035);

    color: #9eefff;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1.7px;

    animation: labelFloat 4s ease-in-out infinite;
}

@keyframes labelFloat {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-4px);
    }
}

/* =========================================================
   MAIN CARD
========================================================= */

.scene {
    width: min(800px, 90vw);

    perspective: 1000px;
}

.card {
    position: relative;

    padding: 70px 55px;

    text-align: center;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.025)
        );

    border: 1px solid rgba(255,255,255,.13);

    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 0 35px rgba(255,255,255,.015);

    transform-style: preserve-3d;

    will-change: transform;

    overflow: hidden;
}

/* Animated neon edge */

.card::before {
    content: "";

    position: absolute;
    inset: -2px;

    border-radius: 32px;

    background:
        conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(0,217,255,.6) 45deg,
            transparent 90deg,
            rgba(145,76,255,.6) 180deg,
            transparent 230deg,
            rgba(255,79,163,.5) 315deg,
            transparent 360deg
        );

    animation: borderRotate 8s linear infinite;

    z-index: -2;
}

.card::after {
    content: "";

    position: absolute;
    inset: 1px;

    border-radius: 29px;

    background: #070a12;

    z-index: -1;
}

@keyframes borderRotate {
    to {
        transform: rotate(360deg);
    }
}

/* Fast light sweep */

.cardLight {
    position: absolute;

    top: -100%;
    left: -40%;

    width: 20%;
    height: 300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.08),
            transparent
        );

    transform: rotate(22deg);

    animation: lightSweep 6s ease-in-out infinite;

    pointer-events: none;
}

@keyframes lightSweep {
    0%, 25% {
        left: -40%;
    }

    70%, 100% {
        left: 140%;
    }
}

/* =========================================================
   CONTENT
========================================================= */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 8px 14px;

    border-radius: 999px;

    border: 1px solid rgba(0,217,255,.2);

    background: rgba(0,217,255,.045);

    color: #86ebff;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 25px;
}

.badgeDot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 8px var(--cyan);

    animation: dotPulse 1.5s infinite;
}

@keyframes dotPulse {
    50% {
        opacity: .35;
        transform: scale(.65);
    }
}

h1 {
    font-size: clamp(44px, 8vw, 82px);

    line-height: .9;

    letter-spacing: -5px;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            white,
            #7deaff,
            #a782ff,
            white
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: textShift 6s linear infinite;
}

@keyframes textShift {
    to {
        background-position: 250% center;
    }
}

.subtitle {
    max-width: 590px;

    margin: 25px auto 0;

    color: #9ba8bd;

    font-size: 16px;

    line-height: 1.7;
}

.highlight {
    color: white;
    font-weight: 800;
}

/* =========================================================
   NAME
========================================================= */

.friendBox {
    display: inline-block;

    margin-top: 32px;

    padding: 18px 25px;

    border-radius: 18px;

    border: 1px solid rgba(255,255,255,.1);

    background:
        linear-gradient(
            135deg,
            rgba(0,217,255,.07),
            rgba(145,76,255,.07)
        );

    animation: friendFloat 4s ease-in-out infinite;

    will-change: transform;
}

.friendSmall {
    color: #66738b;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.friendName {
    margin-top: 5px;

    font-size: clamp(21px, 4vw, 29px);

    font-weight: 900;

    letter-spacing: .5px;
}

.friendName span {
    color: #ff648f;

    text-shadow:
        0 0 15px rgba(255,100,143,.3);
}

@keyframes friendFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}

/* =========================================================
   BOTTOM TEXT
========================================================= */

.bottomText {
    margin-top: 28px;

    color: #566279;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1.5px;

    text-transform: uppercase;
}

.bottomText span {
    color: #74839c;
}

/* =========================================================
   LITTLE ORBS
========================================================= */

.orb {
    position: fixed;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 15px var(--cyan);

    opacity: .4;

    animation: orbFloat 7s ease-in-out infinite;
}

.orb1 {
    left: 13%;
    top: 25%;
}

.orb2 {
    right: 13%;
    top: 70%;

    animation-delay: -3s;

    background: var(--purple);

    box-shadow:
        0 0 15px var(--purple);
}

.orb3 {
    left: 82%;
    top: 20%;

    animation-delay: -5s;

    background: var(--pink);

    box-shadow:
        0 0 15px var(--pink);
}

@keyframes orbFloat {
    0%,100% {
        transform: translate(0,0);
    }

    50% {
        transform: translateY(-20px);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    body {
        padding: 20px;
    }

    .topLabel {
        top: 12px;
        right: 12px;
        font-size: 9px;
    }

    .card {
        padding: 48px 23px;
        border-radius: 24px;
    }

    .subtitle {
        font-size: 14px;
    }

    h1 {
        letter-spacing: -3px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="vignette"></div>

<div class="cursorGlow" id="cursorGlow"></div>

<div class="topLabel">
    AHMAD • PRIVATE
</div>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="scene">

    <div class="card" id="card">

        <div class="cardLight"></div>

        <div class="badge">
            <span class="badgeDot"></span>
            FRIENDS ONLY
        </div>

        <h1>
            YOU'RE NOT<br>
            INVITED.Go to the old site you loser.
        </h1>

        <p class="subtitle">
            This site is <span class="highlight">exclusive to AHMAD'S friends.</span>
            If you're not one of them, you're basically just looking at this page
            for no reason.
        </p>

        <div class="friendBox">

            <div class="friendSmall">
                Exclusive guest
            </div>

            <div class="friendName">
                ELBOZO <span>LOSER</span>
            </div>

        </div>

        <div class="bottomText">
            ACCESS RESERVED FOR <span>AHMAD'S FRIENDS</span>
        </div>

    </div>

</div>

<script>

/* =========================================================
   ULTRA LIGHT MOUSE EFFECT
========================================================= */

const card = document.getElementById("card");
const glow = document.getElementById("cursorGlow");

let mouseX = 0;
let mouseY = 0;

let rotationX = 0;
let rotationY = 0;

let animationRunning = false;

document.addEventListener("mousemove", (event) => {

    mouseX = event.clientX;
    mouseY = event.clientY;

    /*
       CSS variables are used instead of constantly
       rebuilding lots of styles.
    */

    glow.style.left = mouseX + "px";
    glow.style.top = mouseY + "px";

    if (!animationRunning) {
        animationRunning = true;
        requestAnimationFrame(updateCard);
    }
});

function updateCard() {

    const targetX =
        (window.innerHeight / 2 - mouseY) / 32;

    const targetY =
        (mouseX - window.innerWidth / 2) / 32;

    rotationX +=
        (targetX - rotationX) * 0.12;

    rotationY +=
        (targetY - rotationY) * 0.12;

    card.style.transform =
        `rotateX(${rotationX}deg)
         rotateY(${rotationY}deg)`;

    if (
        Math.abs(targetX - rotationX) > .02 ||
        Math.abs(targetY - rotationY) > .02
    ) {
        requestAnimationFrame(updateCard);
    } else {
        animationRunning = false;
    }
}

/* Reset smoothly when mouse leaves */

document.addEventListener("mouseleave", () => {

    rotationX *= .7;
    rotationY *= .7;

    card.style.transform =
        `rotateX(${rotationX}deg)
         rotateY(${rotationY}deg)`;
});

</script>

</body>
</html>
