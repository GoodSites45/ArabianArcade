<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absolutely Not For You</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, #1424ff33, transparent 30%),
        radial-gradient(circle at 80% 80%, #a100ff33, transparent 30%),
        #03050c;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Animated background */
body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
        linear-gradient(90deg, transparent 49%, #ffffff08 50%, transparent 51%),
        linear-gradient(transparent 49%, #ffffff08 50%, transparent 51%);
    background-size: 70px 70px;
    transform: rotate(12deg);
    animation: gridMove 12s linear infinite;
    pointer-events: none;
}

@keyframes gridMove {
    from { transform: rotate(12deg) translate(0, 0); }
    to { transform: rotate(12deg) translate(70px, 70px); }
}

/* Top badge */
.king {
    position: fixed;
    top: 20px;
    right: 22px;
    padding: 10px 16px;
    border-radius: 999px;
    background: #ffffff0d;
    border: 1px solid #00d9ff66;
    backdrop-filter: blur(15px);
    color: #72eaff;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 25px #00d9ff22;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 10px #00d9ff22; }
    to { box-shadow: 0 0 30px #00d9ff66; }
}

/* Main card */
.card {
    width: min(720px, 90%);
    padding: 55px 40px;
    text-align: center;
    border-radius: 30px;
    background: #ffffff09;
    border: 1px solid #ffffff18;
    backdrop-filter: blur(25px);
    box-shadow:
        0 30px 100px #00000099,
        inset 0 0 50px #ffffff05;
    position: relative;
    z-index: 2;
    transition: transform 0.15s ease;
}

.warning {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 999px;
    background: #ff003311;
    border: 1px solid #ff335544;
    color: #ff6b7a;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 25px;
    animation: warningPulse 1.5s infinite;
}

@keyframes warningPulse {
    50% { transform: scale(1.04); }
}

h1 {
    font-size: clamp(40px, 8vw, 78px);
    line-height: 0.95;
    margin-bottom: 20px;
    letter-spacing: -4px;
    background: linear-gradient(
        90deg,
        #fff,
        #6ee7ff,
        #a78bfa,
        #fff
    );
    background-size: 300%;
    -webkit-background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
}

@keyframes shine {

}

}

}

#insult {
    margin-top: 20px;
    min-height: 26px;

button {
    margin-top: 32px;
    padding: 14px 26px;

    color: white;
    font-size: 15px;
    font-weight: bold;

}

.access {

}

}

#status {

}

/* Flash */
.flash {

}

@keyframes flash {

}

/* Mobile */
@media(max-width:600px) {
    .card {
        padding: 40px 22px;
    }

        right: 12px;

</style>
</head>

<body>

<div class="king">👑 AHMAD IS KING</div>

<div class="card" id="card">

    <div class="warning">⚠ EXTREMELY EXCLUSIVE</div>

    <h1>YOU'RE NOT HIM.</h1>

    <div class="subtitle">
        This website is restricted to an extremely powerful,
        highly intelligent and definitely real group of people.
    </div>

    <div class="friend">
        ✅ ELBOZO ONLY
    </div>

    <div id="insult">
        Checking whether you're actually Elbozo...
    </div>

    <div class="access">
        <div class="bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="status">
            Initializing disappointment...
        </div>
    </div>

    <button id="button">
        🔓 TRY TO GET IN
    </button>

</div>

<script>
const insults = [
    "Nope.",
    "Bro really thought he had access 💀",
    "Interesting attempt.",
    "Who invited you?",
    "Elbozo has better permissions than you.",
    "Access denied. Skill issue.",
    "That was embarrassing.",
    "Nice try though.",
    "You are NOT passing this test.",
    "Maybe ask Ahmad."
];

const statuses = [
    "Scanning vibes...",
    "Checking credentials...",
    "Analyzing aura...",
    "Comparing user to Elbozo...",
    "Calculating importance...",
    "Checking friendship level...",
    "Consulting Ahmad...",
    "Access evaluation complete."
];

const insult = document.getElementById("insult");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const button = document.getElementById("button");
const card = document.getElementById("card");

let progressValue = 0;

function runFakeScan() {
    progressValue = 0;

    const interval = setInterval(() => {
        progressValue += Math.random() * 14;

        if (progressValue >= 100) {
            progressValue = 100;
            clearInterval(interval);

            progress.style.width = "100%";

            setTimeout(() => {
                insult.textContent =
                    insults[Math.floor(Math.random() * insults.length)];

                status.textContent =
                    "RESULT: ❌ ACCESS DENIED";

                document.body.classList.add("flash");

                setTimeout(() => {
                    document.body.classList.remove("flash");
                }, 350);
            }, 500);

        } else {
            progress.style.width = progressValue + "%";

            status.textContent =
                statuses[Math.floor(Math.random() * statuses.length)];
        }
    }, 350);
}

button.addEventListener("click", runFakeScan);

/* Random roast every few seconds */
setInterval(() => {
    if (Math.random() > 0.55) {
        insult.textContent =
            insults[Math.floor(Math.random() * insults.length)];
    }
}, 2500);

/* Slight 3D mouse movement */
document.addEventListener("mousemove", e => {
    const x = (window.innerWidth / 2 - e.clientX) / 45;
    const y = (window.innerHeight / 2 - e.clientY) / 45;

    card.style.transform =
        `perspective(900px) rotateX(${y}deg) rotateY(${-x}deg)`;
});

document.addEventListener("mouseleave", () => {
    card.style.transform = "";
});

/* Make the button sometimes move */
button.addEventListener("mouseenter", () => {
    if (Math.random() > 0.65) {
        const x = (Math.random() - 0.5) * 180;
        const y = (Math.random() - 0.5) * 80;

        button.style.transform =
            `translate(${x}px, ${y}px)`;
    }
});

button.addEventListener("mouseleave", () => {
    button.style.transform = "";
});
</script>

</body>
</html>
